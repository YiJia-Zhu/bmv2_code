# PINC intent-to-P4 SFT configuration.
# This is deliberately separate from the p4llms/Generating configs.
model_name_or_path: /mnt/8T/xgr/zhuyijia/huggingface_models/Qwen3-14B

stage: sft
do_train: true
do_eval: true
finetuning_type: lora

dataset_dir: data/finetune/pinc
dataset: pinc_sft_train
eval_dataset: pinc_sft_dev
template: qwen3
enable_thinking: false
cutoff_len: 16384
train_on_prompt: false
packing: false
preprocessing_num_workers: 8

# Match the existing Qwen3-14B training setup: 4-bit QLoRA.
quantization_bit: 4
quantization_method: bnb
quantization_type: nf4
double_quantization: true
upcast_layernorm: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 3.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
optim: paged_adamw_8bit

bf16: true
fp16: false
gradient_checkpointing: true
flash_attn: fa2

logging_strategy: steps
logging_steps: 5
logging_dir: training_runs/qwen3_14b_pinc_sft/tensorboard
report_to: tensorboard
plot_loss: true

eval_strategy: steps
eval_steps: 25
save_strategy: steps
save_steps: 25
save_total_limit: 3
seed: 42
ddp_timeout: 180000000

output_dir: training_runs/qwen3_14b_pinc_sft
overwrite_output_dir: true
